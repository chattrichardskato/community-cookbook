<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Cookbook - Events</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <link rel="stylesheet" href="css/desktop.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <div class="logo-icon">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <rect x="5" y="20" width="30" height="15" rx="3" fill="#C4734F" />
                        <rect x="15" y="5" width="10" height="15" rx="2" fill="#C4734F" />
                        <path d="M12 25 L28 25 L24 32 L16 32 L12 25Z" fill="#C4734F" />
                        <circle cx="20" cy="18" r="6" fill="#F5E6D3" />
                    </svg>
                </div>
                <span class="brand-name">Community Cookbook</span>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="create-recipe.html">Add Recipe</a></li>
                <li><a href="calendar.html">Calendar</a></li>
                <li><a href="events.html" class="active">Events</a></li>
                <li><a href="#" onclick="logoutUser()">Logout</a></li>
                <li>
                    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                        🌓
                    </button>
                </li>
            </ul>
            <button class="hamburger" aria-label="Toggle Menu">☰</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container">
            <div class="page-header">
                <h1>🎉 Community Events</h1>
                <p>Organize potlucks, dinners, and community gatherings</p>
            </div>

            <!-- Create Event Button -->
            <div class="event-actions">
                <button id="createEventBtn" class="btn-primary">➕ Create New Event</button>
            </div>

            <!-- Create Event Modal -->
            <div id="eventModal" class="modal" style="display:none;">
                <div class="modal-content">
                    <span class="modal-close" onclick="closeEventModal()">&times;</span>
                    <h2>Create New Event</h2>
                    <form id="eventForm" onsubmit="createEvent(event)">
                        <div class="form-group">
                            <label for="eventTitle">Event Title *</label>
                            <input type="text" id="eventTitle" placeholder="e.g., Neighborhood Potluck" required />
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="eventDate">Date *</label>
                                <input type="date" id="eventDate" required />
                            </div>
                            <div class="form-group">
                                <label for="eventTime">Time</label>
                                <input type="time" id="eventTime" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="eventLocation">Location</label>
                            <input type="text" id="eventLocation" placeholder="e.g., Community Center" />
                        </div>
                        <div class="form-group">
                            <label for="eventDescription">Description</label>
                            <textarea id="eventDescription" rows="4" placeholder="Describe the event..."></textarea>
                        </div>
                        <div id="messageContainer"></div>
                        <div class="form-actions">
                            <button type="submit" class="btn-primary">Create Event</button>
                            <button type="button" class="btn-secondary" onclick="closeEventModal()">Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Events List -->
            <div id="eventsList" class="events-grid">
                <!-- Events will be dynamically rendered -->
            </div>

            <!-- No Events Message -->
            <div id="noEvents" class="empty-state" style="display:none;">
                <p>No events yet. Be the first to create one! 🎉</p>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <button class="nav-item" data-target="dashboard.html">
            <span class="icon">🏠</span>
            Home
        </button>
        <button class="nav-item" data-target="search.html">
            <span class="icon">🔍</span>
            Search
        </button>
        <button class="nav-item" data-target="calendar.html">
            <span class="icon">📅</span>
            Calendar
        </button>
        <button class="nav-item active" data-target="events.html">
            <span class="icon">🎉</span>
            Events
        </button>
    </nav>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Community Cookbook. Made with ❤️ for our neighborhood.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/events.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
