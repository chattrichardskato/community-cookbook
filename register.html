<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Cookbook - Register</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo-icon">
                    <svg width="60" height="60" viewBox="0 0 40 40" fill="none">
                        <rect x="5" y="20" width="30" height="15" rx="3" fill="#C4734F" />
                        <rect x="15" y="5" width="10" height="15" rx="2" fill="#C4734F" />
                        <path d="M12 25 L28 25 L24 32 L16 32 L12 25Z" fill="#C4734F" />
                        <circle cx="20" cy="18" r="6" fill="#F5E6D3" />
                    </svg>
                </div>
                <h1>Join the Community</h1>
                <p>Share recipes, plan meals, and connect with neighbors</p>
            </div>

            <div id="messageContainer"></div>

            <form id="registerForm" onsubmit="registerUser(event)">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Your full name" required />
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="At least 6 characters" required />
                    <small>Must be at least 6 characters long</small>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" required />
                </div>
                <button type="submit" class="btn-primary btn-large">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html">Sign in here</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
