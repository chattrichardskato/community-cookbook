<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Community Cookbook - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/mobile.css" />
    <link rel="stylesheet" href="css/desktop.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <div class="logo-icon">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <rect x="5" y="20" width="30" height="15" rx="3" fill="#C4734F" />
                        <rect x="15" y="5" width="10" height="15" rx="2" fill="#C4734F" />
                        <path d="M12 25 L28 25 L24 32 L16 32 L12 25Z" fill="#C4734F" />
                        <circle cx="20" cy="18" r="6" fill="#F5E6D3" />
                    </svg>
                </div>
                <span class="brand-name">Community Cookbook</span>
            </div>
            <ul class="nav-links">
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="create-recipe.html">Add Recipe</a></li>
                <li><a href="calendar.html">Calendar</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="#" onclick="logoutUser()">Logout</a></li>
                <li>
                    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode">
                        🌓
                    </button>
                </li>
            </ul>
            <button class="hamburger" aria-label="Toggle Menu">☰</button>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        <div class="container">
            <!-- Welcome Section -->
            <div class="dashboard-header">
                <h1>Welcome back, <span id="userName">Cook</span>! 👩‍🍳</h1>
                <p>Discover and share recipes from your community</p>
            </div>

            <!-- Search & Filter Section -->
            <div class="search-section">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search recipes by name, ingredient, or category..." />
                    <button id="searchBtn" class="btn-primary">🔍 Search</button>
                </div>
                <div class="filter-section">
                    <label for="categoryFilter">Category:</label>
                    <select id="categoryFilter">
                        <option value="all">All Categories</option>
                        <option value="Appetizer">Appetizers</option>
                        <option value="Main Dish">Main Dishes</option>
                        <option value="Side Dish">Side Dishes</option>
                        <option value="Dessert">Desserts</option>
                        <option value="Breakfast">Breakfast</option>
                        <option value="Pasta">Pasta</option>
                        <option value="Soup">Soups</option>
                    </select>
                    <label for="dietaryFilter">Dietary:</label>
                    <select id="dietaryFilter">
                        <option value="all">All Diets</option>
                        <option value="vegetarian">Vegetarian</option>
                        <option value="vegan">Vegan</option>
                        <option value="gluten-free">Gluten-Free</option>
                        <option value="dairy-free">Dairy-Free</option>
                        <option value="nut-free">Nut-Free</option>
                    </select>
                    <button id="clearFilters" class="btn-secondary">Clear Filters</button>
                </div>
            </div>

            <!-- Recipe Grid -->
            <div id="recipe-grid" class="recipe-grid">
                <!-- Recipes will be dynamically loaded here -->
            </div>

            <!-- Load More Button -->
            <div class="load-more">
                <button id="loadMoreBtn" class="btn-secondary">Load More Recipes</button>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
        <button class="nav-item active" data-target="dashboard.html">
            <span class="icon">🏠</span>
            Home
        </button>
        <button class="nav-item" data-target="search.html">
            <span class="icon">🔍</span>
            Search
        </button>
        <button class="nav-item" data-target="calendar.html">
            <span class="icon">📅</span>
            Calendar
        </button>
        <button class="nav-item" data-target="profile.html">
            <span class="icon">👤</span>
            Profile
        </button>
    </nav>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Community Cookbook. Made with ❤️ for our neighborhood.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/database.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/recipes.js"></script>
    <script src="js/search.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
